# Drop-in: cap every login user's slice.
# Install:  sudo install -D -m 0644 systemd/user-slice-limits.conf /etc/systemd/system/user-.slice.d/50-hardened-shell.conf
#           sudo systemctl daemon-reload
# Applies to new sessions.  TasksMax is a cgroup pids.max: unlike RLIMIT_NPROC it
# counts tasks inside the slice only and also applies to root-owned tasks in it.
[Slice]
TasksMax=512
MemoryMax=2G
MemorySwapMax=0
CPUQuota=200%
